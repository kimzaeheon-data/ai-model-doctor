[project]
name = "ai-model-doctor"
version = "0.1.0"
description = "Diagnostic tooling for Ultralytics YOLO training results"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.23",
    "openai>=2.0",
    "PyYAML>=6.0",
]

[project.scripts]
model-doctor-parse = "model_doctor.parser:main"
model-doctor-diagnose = "model_doctor.diagnosis:main"
model-doctor-chat = "model_doctor.llm:main"
model-doctor-plan = "model_doctor.change_plan_llm:main"
model-doctor-approve = "model_doctor.change_plan:main"
model-doctor-execute = "model_doctor.executor:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["model_doctor*"]
